[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "varp-k26-research-artifact"
version = "2.0.0"
description = "Analytical scheduler model and bounded RTL evidence for the VARP K26 study"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
