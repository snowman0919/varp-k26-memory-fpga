name: public-artifact-ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  python-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: make setup
      - run: make test

  rtl:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: sbt/setup-sbt@v1
      - run: sudo apt-get update && sudo apt-get install -y verilator
      - run: make rtl-test

  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: sbt/setup-sbt@v1
      - uses: browser-actions/setup-chrome@v1
      - run: |
          sudo apt-get update
          sudo apt-get install -y verilator kicad pandoc poppler-utils ffmpeg fonts-noto-cjk
      - run: make setup
      - run: make reproduce
      - name: Build deterministic release archives
        run: python3 scripts/build_release.py
      - name: Test Source ZIP without Git metadata
        run: make source-archive-test
