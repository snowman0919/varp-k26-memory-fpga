<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320">
  <defs>
    <marker id="arrow1" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="context-stroke"/></marker>
    <style>
      text{font-family:"Noto Sans CJK KR","Noto Sans",sans-serif;fill:#172033}
      .h{font-size:23px;font-weight:700}.t{font-size:16px;font-weight:700}.s{font-size:14px}
      .compute{fill:#eef5fb;stroke:#1677b8;stroke-width:3}.memory{fill:#fff4df;stroke:#e89b00;stroke-width:3}
      .link{fill:#e9f7f1;stroke:#159a78;stroke-width:3}.blocked{fill:#fff0f0;stroke:#c94c4c;stroke-width:3;stroke-dasharray:8 5}
    </style>
  </defs>
  <text class="h" x="24" y="29">Figure 1 · Implemented RTL planes and missing end-to-end loop</text>

  <text class="t" x="24" y="78" fill="#1677b8">COMPUTE</text>
  <rect class="compute" x="118" y="48" width="148" height="58" rx="9"/>
  <text class="t" x="192" y="70" text-anchor="middle">TileJob + payload</text>
  <text class="s" x="192" y="94" text-anchor="middle">external functional input</text>
  <line x1="266" y1="77" x2="294" y2="77" stroke="#1677b8" stroke-width="3" marker-end="url(#arrow1)"/>
  <rect class="compute" x="300" y="48" width="190" height="58" rx="9"/>
  <text class="t" x="395" y="68" text-anchor="middle">TileScheduler</text>
  <text class="s" x="395" y="87" text-anchor="middle">+ payload store</text>
  <text class="s" x="395" y="102" text-anchor="middle">identity-preserving</text>
  <line x1="490" y1="77" x2="518" y2="77" stroke="#1677b8" stroke-width="3" marker-end="url(#arrow1)"/>
  <rect class="compute" x="524" y="48" width="162" height="58" rx="9"/>
  <text class="t" x="605" y="70" text-anchor="middle">ComputeCluster</text>
  <text class="s" x="605" y="94" text-anchor="middle">DecodeMatVecInt8</text>
  <line x1="686" y1="77" x2="714" y2="77" stroke="#1677b8" stroke-width="3" marker-end="url(#arrow1)"/>
  <rect class="compute" x="720" y="48" width="56" height="58" rx="9"/>
  <text class="t" x="748" y="83" text-anchor="middle">result</text>

  <text class="t" x="24" y="151" fill="#e89b00">MEMORY</text>
  <rect class="memory" x="118" y="122" width="148" height="58" rx="9"/>
  <text class="t" x="192" y="144" text-anchor="middle">memoryRequest</text>
  <text class="s" x="192" y="168" text-anchor="middle">external command input</text>
  <line x1="266" y1="151" x2="332" y2="151" stroke="#e89b00" stroke-width="3" marker-end="url(#arrow1)"/>
  <rect class="memory" x="338" y="122" width="214" height="58" rx="9"/>
  <text class="t" x="445" y="144" text-anchor="middle">channel ingress</text>
  <text class="s" x="445" y="168" text-anchor="middle">bank-aware command queue</text>
  <line x1="552" y1="151" x2="618" y2="151" stroke="#e89b00" stroke-width="3" marker-end="url(#arrow1)"/>
  <rect class="memory" x="624" y="122" width="152" height="58" rx="9"/>
  <text class="t" x="700" y="157" text-anchor="middle">memoryCommands</text>

  <text class="t" x="24" y="223" fill="#159a78">LINK</text>
  <rect class="link" x="118" y="194" width="148" height="58" rx="9"/>
  <text class="t" x="192" y="216" text-anchor="middle">linkInput</text>
  <text class="s" x="192" y="240" text-anchor="middle">external routing input</text>
  <line x1="266" y1="223" x2="388" y2="223" stroke="#159a78" stroke-width="3" marker-end="url(#arrow1)"/>
  <rect class="link" x="394" y="194" width="152" height="58" rx="9"/>
  <text class="t" x="470" y="229" text-anchor="middle">BundleRouter</text>
  <line x1="546" y1="223" x2="618" y2="223" stroke="#159a78" stroke-width="3" marker-end="url(#arrow1)"/>
  <rect class="link" x="624" y="194" width="152" height="58" rx="9"/>
  <text class="t" x="700" y="229" text-anchor="middle">linkBundles</text>

  <rect class="blocked" x="118" y="266" width="658" height="42" rx="9"/>
  <text x="447" y="283" text-anchor="middle" font-size="14px" font-weight="700">MISSING: DDR/link response → DMA sequencing → weight FIFO → compute payload store</text>
  <text class="s" x="447" y="301" text-anchor="middle">No PHY, GT wrapper, returned-weight path, timing closure, or board measurement</text>
</svg>
