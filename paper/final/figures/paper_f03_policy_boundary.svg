<svg xmlns="http://www.w3.org/2000/svg" width="800" height="292" viewBox="0 0 800 292">
  <defs>
    <marker id="arrow2b" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#1677b8"/></marker>
    <style>
      text{font-family:"Noto Sans CJK KR","Noto Sans",sans-serif;fill:#172033}
      .h{font-size:26px;font-weight:700}.t{font-size:20px;font-weight:700}.s{font-size:18px}
      .rtl{fill:#eef5fb;stroke:#1677b8;stroke-width:3}.model{fill:#fff4df;stroke:#e89b00;stroke-width:3}
      .blocked{fill:#f1f2f4;stroke:#6b7280;stroke-width:3;stroke-dasharray:9 6}
    </style>
  </defs>
  <text class="h" x="24" y="34">Figure 3 · S1 → S2 → S3 policy ladder and evidence boundary</text>
  <rect class="rtl" x="24" y="62" width="166" height="78" rx="10"/>
  <text class="t" x="107" y="94" text-anchor="middle">S1 static local</text>
  <text class="s" x="107" y="121" text-anchor="middle">home queue only</text>
  <line x1="190" y1="101" x2="228" y2="101" stroke="#1677b8" stroke-width="4" marker-end="url(#arrow2b)"/>
  <rect class="rtl" x="236" y="62" width="166" height="78" rx="10"/>
  <text class="t" x="319" y="94" text-anchor="middle">S2 oldest steal</text>
  <text class="s" x="319" y="121" text-anchor="middle">eligible victim job</text>
  <line x1="402" y1="101" x2="440" y2="101" stroke="#1677b8" stroke-width="4" marker-end="url(#arrow2b)"/>
  <rect class="rtl" x="448" y="62" width="166" height="78" rx="10"/>
  <text class="t" x="531" y="91" text-anchor="middle">S3 locality</text>
  <text class="s" x="531" y="116" text-anchor="middle">age score −</text>
  <text class="s" x="531" y="135" text-anchor="middle">migration penalty</text>
  <line x1="614" y1="101" x2="652" y2="101" stroke="#1677b8" stroke-width="4" marker-end="url(#arrow2b)"/>
  <rect class="rtl" x="660" y="62" width="116" height="78" rx="10"/>
  <text class="t" x="718" y="94" text-anchor="middle">MatVec</text>
  <text class="s" x="718" y="121" text-anchor="middle">exact-once</text>
  <rect class="model" x="24" y="154" width="472" height="74" rx="10"/>
  <text class="t" x="260" y="180" text-anchor="middle">ANALYTICAL migration cost</text>
  <text class="s" x="260" y="204" text-anchor="middle">remote bytes + modeled link/memory service</text>
  <rect class="blocked" x="516" y="154" width="260" height="74" rx="10"/>
  <text x="646" y="180" text-anchor="middle" font-size="18px" font-weight="700">BLOCKED transaction path</text>
  <text class="s" x="646" y="201" text-anchor="middle">scheduler → DMA/link/DDR</text>
  <text class="s" x="646" y="220" text-anchor="middle">→ response/release</text>
  <text class="s" x="400" y="260" text-anchor="middle">Blue = RTL decision/dispatch/MatVec · orange = analytical migration cost</text>
  <text class="s" x="400" y="283" text-anchor="middle">Gray dashed = remote-weight transaction path not integrated</text>
</svg>
